name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Frontend check (Biome + tsc)
        working-directory: frontend
        run: npm run check

      - name: Frontend tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: cargo fmt
        run: cargo fmt --manifest-path backend/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Tauri build (debug, sem bundle)
        working-directory: frontend
        run: npm run tauri -- build --debug --no-bundle
