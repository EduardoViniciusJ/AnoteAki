[package]
name = "anoteaki"
version = "0.1.0"
description = "Notas rápidas estilo post-it com atalho global (Windows)"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "anoteaki_lib"

[build-dependencies]
# Gera o contexto do app (config, ACL, ícones) em tempo de compilação.
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Runtime do app desktop. Sem as features padrão: só o WebView (wry) e a
# compressão dos assets embutidos; tray e plugins entram nas tarefas deles.
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression"] }
# Serializa AppError e os payloads dos eventos para o front (camelCase).
serde = { version = "1.0.229", features = ["derive"] }
# Mensagem (Display) dos erros do AppError sem boilerplate.
thiserror = "2.0.21"
# Atalho global registrado no Rust (o JS não recebe permissão do plugin).
tauri-plugin-global-shortcut = "2.4.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
# Confere nos testes o JSON exato que o front recebe.
serde_json = "1.0.154"
