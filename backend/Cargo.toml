[package]
name = "anoteaki"
version = "0.1.0"
description = "Notas rápidas estilo post-it com atalho global (Windows)"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "anoteaki_lib"

[build-dependencies]
# Generates the app context (config, ACL, icons) at build time.
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Desktop app runtime. No default features: only the WebView (wry),
# compression of embedded assets and the tray icon (T40).
tauri = { version = "2.12.5", default-features = false, features = ["wry", "compression", "tray-icon"] }
# Serializes AppError and event payloads for the UI (camelCase).
serde = { version = "1.0.229", features = ["derive"] }
# AppError messages (Display) without boilerplate.
thiserror = "2.0.21"
# Global shortcut registered in Rust (JS gets no permission for the plugin).
tauri-plugin-global-shortcut = "2.4.1"
# Local SQLite for notes. `bundled` builds SQLite in (with FTS5, used by search)
# so no DLL is needed on Windows; no default features (statement cache and WASM).
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
# A second launch only shows the running app instead of starting another one (T41).
tauri-plugin-single-instance = "2.5.5"
# Opens Ctrl+clicked links in the default browser. Used from Rust only (after
# `open_link` validates the URL); JS gets no opener permission.
tauri-plugin-opener = "2.7.2"

[target.'cfg(windows)'.dependencies]
# Turns off the WebView2 browser keys (Ctrl+F find bar, Ctrl+P, F5...).
# Same versions Tauri/wry already use, so the COM types match.
webview2-com = "0.39.1"
# `Interface::cast` for the WebView2 COM settings above.
windows-core = "0.62.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
# Checks in tests the exact JSON the UI receives.
serde_json = "1.0.154"
